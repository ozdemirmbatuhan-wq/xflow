name: Build Windows EXE with flow5 7.57

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FLOW5_SHA: a9e852c559590188e00e9efe997c35c1dec7209b
  PYTHONUTF8: "1"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Check out AeroOpt
        uses: actions/checkout@v5

      - name: Check out pinned flow5 7.57 source
        uses: actions/checkout@v5
        with:
          repository: techwinder/flow5
          ref: ${{ env.FLOW5_SHA }}
          path: deps/flow5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Test Python orchestration
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Set up Qt 6.9.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download pinned OpenBLAS 0.3.34
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $version = "0.3.34"
          $archive = "$PWD\deps\downloads\OpenBLAS-$version-x64.zip"
          $root = "$PWD\deps\openblas"
          $expectedSha256 = "e9cb6134541f36c27346d5fc5995652f060fba227cebbbabcbda5a5a44d7c76b"

          New-Item -ItemType Directory -Force "$PWD\deps\downloads", $root | Out-Null
          Invoke-WebRequest `
            "https://github.com/OpenMathLib/OpenBLAS/releases/download/v$version/OpenBLAS-$version-x64.zip" `
            -OutFile $archive

          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "OpenBLAS archive checksum mismatch: $actualSha256"
          }

          Expand-Archive $archive $root -Force

          # flow5 7.57 includes <openblas/cblas.h> and
          # <openblas/lapack.h>; the official archive keeps these at
          # include/*.h. Preserve the originals and add the layout flow5 uses.
          $qualifiedHeaders = Join-Path $root "include\openblas"
          New-Item -ItemType Directory -Force $qualifiedHeaders | Out-Null
          Copy-Item (Join-Path $root "include\*.h") $qualifiedHeaders -Force

          $required = @(
            "include\openblas\cblas.h",
            "include\openblas\lapack.h",
            "include\openblas\lapacke_config.h",
            "include\openblas\lapacke_mangling.h",
            "lib\libopenblas.lib",
            "bin\libopenblas.dll"
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $root $relative))) {
              throw "OpenBLAS package is missing $relative"
            }
          }

          $openBlasDll = Join-Path $root "bin\libopenblas.dll"
          $headers = (& dumpbin /nologo /headers $openBlasDll 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch '(?i)8664 machine \(x64\)') {
            throw "OpenBLAS runtime is not a valid x64 DLL"
          }
          $exports = (& dumpbin /nologo /exports $openBlasDll 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect OpenBLAS exports" }
          $requiredSymbols = @(
            "cblas_dgemm", "cblas_dgemv", "cblas_sgemv",
            "dgels_", "dgetrf_", "dgetri_", "dgetrs_", "sgetrf_", "sgetrs_"
          )
          foreach ($symbol in $requiredSymbols) {
            $symbolPattern = '(?m)\s+' + [regex]::Escape($symbol) + '\s*$'
            if ($exports -notmatch $symbolPattern) {
              throw "OpenBLAS runtime is missing required symbol $symbol"
            }
          }

          "OPENBLAS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download pinned OCCT and Gmsh SDKs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $sdkDirectories = @("deps/downloads", "deps/occt", "deps/thirdparty", "deps/gmsh")
          New-Item -ItemType Directory -Force -Path $sdkDirectories | Out-Null

          $occtBundle = "deps/downloads/occt-release.zip"
          $occtBundleDir = "deps/downloads/occt-release"

          Invoke-WebRequest "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_2/opencascade-release-no-pch.zip" -OutFile $occtBundle
          Invoke-WebRequest "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_2/3rdparty-vc14-64.zip" -OutFile deps/downloads/thirdparty.zip
          Invoke-WebRequest "https://gmsh.info/bin/Windows/gmsh-4.14.1-Windows64-sdk.zip" -OutFile deps/downloads/gmsh.zip

          $downloadHashes = @{
            "deps/downloads/occt-release.zip" = "e3c75156d195fa28fc61b0fe6e163303e7130c570076a1e9e6cb5cf74d29d7bb"
            "deps/downloads/thirdparty.zip" = "529138c4aba4753402c414615ef5caa791e5a24934bcf8803dab0e4e24edf5f4"
            "deps/downloads/gmsh.zip" = "0220812a7afd177b7d7bc28bea7cfaab6c803f1039eea860bdc3ff3b2bc36408"
          }
          foreach ($download in $downloadHashes.GetEnumerator()) {
            $actual = (Get-FileHash $download.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $download.Value) {
              throw "SDK archive checksum mismatch for $($download.Key): $actual"
            }
          }

          Expand-Archive $occtBundle $occtBundleDir -Force
          $occtArchive = Get-ChildItem $occtBundleDir -File -Filter "opencascade-*.zip" | Select-Object -First 1
          if (-not $occtArchive) { throw "OCCT inner archive was not found" }

          Expand-Archive $occtArchive.FullName deps/occt -Force
          $thirdPartyBundleDir = "deps/downloads/thirdparty-release"
          Expand-Archive deps/downloads/thirdparty.zip $thirdPartyBundleDir -Force
          $thirdPartyArchive = Get-ChildItem $thirdPartyBundleDir -File -Filter "3rdparty-*.zip" | Select-Object -First 1
          if (-not $thirdPartyArchive) { throw "OCCT third-party inner archive was not found" }
          Expand-Archive $thirdPartyArchive.FullName deps/thirdparty -Force
          Expand-Archive deps/downloads/gmsh.zip deps/gmsh -Force

          $occ = Get-ChildItem deps/occt -Directory -Recurse | Where-Object {
            (Test-Path (Join-Path $_.FullName "inc/Standard.hxx")) -and
            (Test-Path (Join-Path $_.FullName "win64/vc14/lib/TKernel.lib"))
          } | Select-Object -First 1
          $gmsh = Get-ChildItem deps/gmsh -Directory -Recurse | Where-Object {
            (Test-Path (Join-Path $_.FullName "include/gmsh.h")) -and
            (Test-Path (Join-Path $_.FullName "lib/gmsh.dll.lib"))
          } | Select-Object -First 1

          if (-not $occ) { throw "OCCT 7.9.2 SDK root was not found" }
          if (-not $gmsh) { throw "Gmsh 4.14.1 SDK root was not found" }

          "OCCT_ROOT=$($occ.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GMSH_ROOT=$($gmsh.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build flow5 libraries and AeroOpt runner
        shell: pwsh
        run: |
          $buildScript = Join-Path $PWD "ci\build_flow5_windows.ps1"
          $buildArguments = @{
            Flow5Source = "$PWD\deps\flow5"
            OccRoot = $env:OCCT_ROOT
            GmshRoot = $env:GMSH_ROOT
            OpenBlasRoot = $env:OPENBLAS_ROOT
            BridgeBuild = "$PWD\build\flow5-runner"
          }
          & $buildScript @buildArguments

      - name: Collect flow5 runtime DLLs
        shell: pwsh
        run: |
          $collectorScript = Join-Path $PWD "ci\collect_flow5_runtime.ps1"
          $collectorArguments = @{
            Runner = "$PWD\build\flow5-runner\Release\aeropt-flow5-runner.exe"
            Flow5Source = "$PWD\deps\flow5"
            OccRoot = $env:OCCT_ROOT
            ThirdPartyRoot = "$PWD\deps\thirdparty"
            GmshRoot = $env:GMSH_ROOT
            OpenBlasRoot = $env:OPENBLAS_ROOT
            Destination = "$PWD\build\flow5-runtime"
          }
          & $collectorScript @collectorArguments

      - name: Smoke-test real flow5 analyses
        shell: pwsh
        run: |
          $env:PATH = "$PWD\build\flow5-runtime;$env:PATH"
          python ci/smoke_flow5_runner.py "$PWD\build\flow5-runtime\aeropt-flow5-runner.exe"

      - name: Build self-contained AeroOpt application
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.10,<7"
          pyinstaller --noconfirm --clean --onedir --windowed --name AeroOpt `
            --add-data "static;static" `
            --add-data "build/flow5-runtime;flow5" `
            --add-data "LICENSE;licenses" `
            --add-data "flow5_bridge/LICENSE;licenses/flow5-bridge" `
            --add-data "THIRD_PARTY_NOTICES.md;licenses" `
            server.py

      - name: Smoke-test packaged EXE health endpoint
        shell: pwsh
        run: |
          $process = Start-Process "$PWD\dist\AeroOpt\AeroOpt.exe" -ArgumentList "--no-browser", "--port", "8765" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/api/health"
                if ($health.ok) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "Packaged AeroOpt.exe did not become healthy" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/AeroOpt/* -DestinationPath artifacts/AeroOpt-0.8.0-Windows-flow5.zip
          Get-FileHash artifacts/AeroOpt-0.8.0-Windows-flow5.zip -Algorithm SHA256

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AeroOpt-0.8.0-Windows-flow5
          path: artifacts/AeroOpt-0.8.0-Windows-flow5.zip
          if-no-files-found: error
          compression-level: 0

  verify-windows-artifact:
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out UI smoke test
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download uploaded Windows application
        uses: actions/download-artifact@v5
        with:
          name: AeroOpt-0.8.0-Windows-flow5
          path: downloaded-artifact

      - name: Extract downloaded application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive `
            "$PWD\downloaded-artifact\AeroOpt-0.8.0-Windows-flow5.zip" `
            "$PWD\downloaded-app" `
            -Force
          if (-not (Test-Path "$PWD\downloaded-app\AeroOpt.exe")) {
            throw "Downloaded artifact does not contain AeroOpt.exe"
          }

      - name: Exercise downloaded EXE user interface
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install "playwright==1.55.0"
          $process = Start-Process `
            "$PWD\downloaded-app\AeroOpt.exe" `
            -ArgumentList "--no-browser", "--port", "8766" `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8766/api/health"
                if ($health.ok) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "Downloaded AeroOpt.exe did not become healthy" }
            python ci/smoke_packaged_ui.py "http://127.0.0.1:8766"
            if ($LASTEXITCODE -ne 0) { throw "Downloaded AeroOpt UI smoke test failed" }
            python ci/run_packaged_design_acceptance.py "http://127.0.0.1:8766"
            if ($LASTEXITCODE -ne 0) { throw "Downloaded AeroOpt 140 kN acceptance test failed" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

